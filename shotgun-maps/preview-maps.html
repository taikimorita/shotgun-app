<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shotgun maps preview</title>
    <style>
      * { box-sizing: border-box; } body { align-items: center; background: #eaf3f9; display: flex; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; justify-content: center; margin: 0; min-height: 100vh; padding: 20px; }
      .phone { background: #f5fafd; max-width: 492px; min-height: 909px; padding: 24px 20px; width: 100%; } .brand { align-items: center; display: flex; gap: 12px; margin: 10px 0 20px; } .brand-icon { align-items: center; background: #4f7ea8; border-radius: 14px; display: flex; font-size: 28px; height: 56px; justify-content: center; width: 56px; } .brand-name { color: #102a43; font-size: 30px; font-weight: 900; letter-spacing: 1px; }
      .map { background: #eaf1f8; border-radius: 20px; height: 260px; overflow: hidden; position: relative; } .road { background: #d7e2ee; height: 34px; opacity: .8; position: absolute; width: 145%; } .road-one { left: -65px; top: 72px; transform: rotate(-35deg); } .road-two { left: -75px; top: 155px; transform: rotate(37deg); } .route { background: #4f7ea8; border-radius: 99px; height: 7px; left: 20%; position: absolute; top: 51%; transform: rotate(-29deg); width: 64%; } .waypoint { align-items: center; background: #fff; border: 0; border-radius: 50%; box-shadow: 0 3px 8px #102a3326; cursor: pointer; display: flex; font-size: 28px; height: 54px; justify-content: center; position: absolute; width: 54px; } .waypoint.active { outline: 3px solid #102a43; } #pickup-waypoint { bottom: 18%; left: 16%; } #destination-waypoint { right: 14%; top: 16%; }
      h1 { color: #102a43; font-size: 29px; letter-spacing: -.7px; margin: 24px 0 16px; } .location { align-items: center; background: #fff; border: 1px solid #c7d8e8; border-radius: 16px; display: flex; gap: 12px; margin-top: 14px; min-height: 98px; padding: 16px; } .cap { font-size: 30px; } .copy { flex: 1; } label { color: #4f7ea8; display: block; font-size: 13px; font-weight: 800; letter-spacing: 1.1px; } input { border: 0; color: #102a43; font: inherit; font-size: 19px; font-weight: 700; margin-top: 4px; outline: 0; padding: 0; width: 100%; } .rides { background: #4f7ea8; border: 0; border-radius: 16px; color: #fff; cursor: pointer; font-size: 21px; font-weight: 800; margin-top: 24px; min-height: 64px; width: 100%; } .rides:active { background: #102a43; } .results { background: #e3f4ec; border-radius: 16px; color: #102a43; display: none; margin-top: 16px; padding: 16px; } .results.show { display: block; } .results strong { color: #1f6b4e; display: block; font-size: 17px; margin-bottom: 4px; } .helper { color: #526f8d; font-size: 14px; line-height: 20px; margin: 20px 10px 0; text-align: center; }
    </style>
  </head>
  <body>
    <main class="phone"><header class="brand"><span class="brand-icon">🚗</span><span class="brand-name">SHOTGUN</span></header><section aria-label="Route map" class="map"><span class="road road-one"></span><span class="road road-two"></span><span class="route"></span><button aria-label="Pickup waypoint" class="waypoint active" id="pickup-waypoint">🎓</button><button aria-label="Destination waypoint" class="waypoint" id="destination-waypoint">🎓</button></section><h1>Where do you need to go?</h1><section class="location"><span class="cap">🎓</span><div class="copy"><label for="pickup">PICKUP</label><input id="pickup" value="Sproul Plaza"></div></section><section class="location"><span class="cap">🎓</span><div class="copy"><label for="destination">DESTINATION</label><input id="destination" value="Northgate, Berkeley"></div></section><button class="rides" id="rides">View rides</button><section aria-live="polite" class="results" id="results"><strong>3 rides found</strong><span id="route-summary"></span></section><p class="helper">Your destination is shared only with your matched driver after you confirm.</p></main>
    <script>
      const pickup = document.querySelector('#pickup'); const destination = document.querySelector('#destination'); const pickupPoint = document.querySelector('#pickup-waypoint'); const destinationPoint = document.querySelector('#destination-waypoint');
      const activate = active => { pickupPoint.classList.toggle('active', active === 'pickup'); destinationPoint.classList.toggle('active', active === 'destination'); (active === 'pickup' ? pickup : destination).focus(); };
      pickupPoint.onclick = () => activate('pickup'); destinationPoint.onclick = () => activate('destination'); pickup.onfocus = () => activate('pickup'); destination.onfocus = () => activate('destination');
      document.querySelector('#rides').onclick = () => { document.querySelector('#route-summary').textContent = `From ${pickup.value || 'your pickup'} to ${destination.value || 'your destination'}`; document.querySelector('#results').classList.add('show'); };
    </script>
  </body>
</html>
