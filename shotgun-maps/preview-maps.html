<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shotgun maps preview</title>
    <style>
      * { box-sizing: border-box; }
      body { align-items: center; background: #eaf3f9; display: flex; justify-content: center; margin: 0; min-height: 100vh; padding: 20px; }
      .phone { aspect-ratio: 492 / 909; max-width: 492px; position: relative; width: 100%; }
      img { display: block; height: 100%; width: 100%; }
      button { background: transparent; border: 0; cursor: pointer; position: absolute; }
      button:active { opacity: .72; }
      button:focus-visible { outline: 3px solid #102a43; outline-offset: 3px; }
      #map { border-radius: 22px; height: 29%; left: 8%; right: 8%; top: 18%; }
      #pickup { border-radius: 18px; height: 10.8%; left: 8%; right: 8%; top: 55.2%; }
      #destination { border-radius: 18px; height: 10.8%; left: 8%; right: 8%; top: 67.8%; }
      #rides { border-radius: 16px; height: 7.8%; left: 8%; right: 8%; top: 81.1%; }
    </style>
  </head>
  <body>
    <main class="phone">
      <img alt="Shotgun route selection" src="maps-reference.png" />
      <button aria-label="Open route map" id="map"></button>
      <button aria-label="Choose pickup: Sproul Plaza" id="pickup"></button>
      <button aria-label="Choose destination: Northgate, Berkeley" id="destination"></button>
      <button aria-label="View rides" id="rides"></button>
    </main>
    <script>
      const actions = { map: 'Map selected.', pickup: 'Pickup: Sproul Plaza.', destination: 'Destination: Northgate, Berkeley.', rides: 'Showing available rides.' };
      Object.entries(actions).forEach(([id, message]) => document.querySelector(`#${id}`).addEventListener('click', () => window.alert(message)));
    </script>
  </body>
</html>
