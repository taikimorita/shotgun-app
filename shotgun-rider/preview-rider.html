<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shotgun rider profile preview</title><style>*{box-sizing:border-box}body{align-items:center;background:#eaf3f9;display:flex;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;justify-content:center;margin:0;min-height:100vh;padding:20px}.phone{background:#f5fafd;max-width:478px;min-height:909px;padding:28px 36px;width:100%}.logo{height:64px;object-fit:contain;width:235px}h1{color:#102a43;font-size:31px;letter-spacing:-.8px;margin:24px 0}.profile{align-items:center;display:flex;gap:16px;margin-bottom:20px}.profile-image{height:112px;width:112px}.name{color:#102a43;font-size:26px;font-weight:800}.verified{align-items:center;background:#dceaf4;border-radius:999px;color:#4f7ea8;display:flex;font-size:14px;font-weight:700;gap:7px;margin-top:10px;padding:7px 10px}.check{background:#4f7ea8;border-radius:50%;color:#fff;display:grid;height:20px;place-items:center;width:20px}.category{align-items:center;background:#fff;border:1px solid #c7d8e8;border-radius:16px;cursor:pointer;display:flex;gap:12px;margin-top:12px;min-height:82px;padding:16px;text-align:left;width:100%}.category.selected{border:2px solid #102a43}.category:active,.save:active{opacity:.76}.icon{height:45px;object-fit:contain;width:45px}.copy{flex:1}.label{color:#526f8d;font-size:15px;font-weight:600}.value{color:#102a43;font-size:18px;font-weight:700;margin-top:3px}.chevron{color:#526f8d;font-size:33px}.save{background:#ff8a6a;border:0;border-radius:16px;color:#fff;cursor:pointer;font-size:20px;font-weight:800;margin-top:20px;min-height:68px;width:100%}.status{color:#1f6b4e;font-size:14px;font-weight:700;min-height:20px;text-align:center}.private{color:#526f8d;font-size:14px;margin-top:12px;text-align:center}</style></head><body><main class="phone"><img alt="Shotgun logo" class="logo" src="shotgun-logo.png"><h1>Your rider profile</h1><section class="profile"><img alt="Maya Chen profile picture" class="profile-image" src="maya-profile.png"><div><div class="name">Maya Chen</div><div class="verified"><span class="check">✓</span>School email verified</div></div></section><button class="category" data-field="University"><img alt="" class="icon" src="university-icon.png"><span class="copy"><span class="label">University</span><br><span class="value">UC Berkeley</span></span><span class="chevron">›</span></button><button class="category" data-field="Graduation year"><img alt="" class="icon" src="graduation-icon.png"><span class="copy"><span class="label">Graduation year</span><br><span class="value">2026</span></span><span class="chevron">›</span></button><button class="category" data-field="Phone number"><img alt="" class="icon" src="phone-icon.png"><span class="copy"><span class="label">Phone number</span><br><span class="value">(510) 555-1234</span></span><span class="chevron">›</span></button><button class="category" data-field="Emergency contact"><img alt="" class="icon" src="emergency-icon.png"><span class="copy"><span class="label">Emergency contact</span><br><span class="value">Add contact</span></span><span class="chevron">›</span></button><button class="save" id="save">Save rider profile</button><p aria-live="polite" class="status" id="status"></p><p class="private">Your information is secure and private.</p></main><script>const status=document.querySelector('#status');document.querySelectorAll('.category').forEach(button=>button.onclick=()=>{document.querySelectorAll('.category').forEach(item=>item.classList.remove('selected'));button.classList.add('selected');status.textContent=`${button.dataset.field} selected.`});document.querySelector('#save').onclick=()=>{status.textContent='Rider profile saved.'}</script></body></html>
